# PROVISIONAL test definition of a claim resource, for the Exec Agent's
# tests only.
#
# The Exec Agent's claim checks are issue #16's (EA-010 to EA-013); until
# they land, the agent keeps flintlock-runner's provisional lookup, which
# reads this resource. Every name here is under the group
# claims.test.battery.liquidmetal-x.dev so that it can never be mistaken for
# this project's MicroVMClaim (battery.liquidmetal-x.dev), and
# internal/execagent's ProvisionalClaimResource names the same fields. #16
# replaces the lookup and this file goes.
#
# The facts the Exec Agent reads:
#   status.phase            Pending, Bound, Expired or Released
#   status.microVM.uid      the flintlock uid of the bound MicroVM
#   status.host.nodeName    the node name of the Host's Node
#   status.leaseExpiresAt   when the lease runs out (RFC 3339)
#   metadata.annotations["claims.test.battery.liquidmetal-x.dev/creator"]
#                           the user name of the identity that created it
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: microvmclaims.claims.test.battery.liquidmetal-x.dev
spec:
  group: claims.test.battery.liquidmetal-x.dev
  scope: Namespaced
  names:
    kind: MicroVMClaim
    listKind: MicroVMClaimList
    plural: microvmclaims
    singular: microvmclaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                poolRef:
                  type: object
                  properties:
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Bound, Expired, Released]
                microVM:
                  type: object
                  properties:
                    uid:
                      type: string
                host:
                  type: object
                  properties:
                    nodeName:
                      type: string
                leaseExpiresAt:
                  type: string
                  format: date-time
