name: ci

# Each job runs a function of the Dagger module in .dagger/, the same
# `dagger call` a developer runs locally from devbox.

on:
  pull_request:
    # edited: the coverage gate reads the PR body's Owns: line
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    # a version tag publishes the images at that version
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # A tag's run and main's run of the same commit each publish, so neither
  # may cancel the other.
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

env:
  # matches DAGGER_VERSION in devbox.json and engineVersion in dagger.json.
  # Every job sets Dagger up with .github/actions/setup-dagger, which pulls
  # the engine image with retries (#125).
  DAGGER_VERSION: 0.21.9
  DAGGER_NO_NAG: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: build export --path=bin/manager
      # Both images, for both platforms, so that a PR which breaks one fails
      # here rather than when main publishes.
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: images entries

  check-generated:
    name: check-generated
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: check-generated

  # The Quint models (specs/quint). Not a required check; the maintainer
  # makes it one in the branch protection when ready.
  quint:
    name: quint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: quint

  # The e2e suite (test/e2e/README.md). kind runs on the runner, in the
  # runner's Docker, rather than inside a Dagger function: the images are
  # still built by Dagger and exported to that Docker, which is what
  # `make docker-build` does locally. Not a required check yet; the
  # maintainer makes it one once it has been stable for a while (#69).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.30.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Installs the CLI and pulls the engine; make calls it.
      - uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: make test-e2e
        env:
          E2E_LOGS_DIR: ${{ runner.temp }}/e2e-logs
        run: make test-e2e
      - name: upload the cluster's logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the snapshot guard and the citation ratchet below need the base
          # branch and main's history
          fetch-depth: 0
      # The snapshot records every requirement's status. It changes only at
      # milestones, so that parallel branches do not all conflict on it.
      - name: snapshot changes only at milestones
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- .duvet/snapshot.txt; then
            exit 0
          fi
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -q '^Snapshot: milestone'; then
            echo "snapshot change accepted: the PR body declares a milestone snapshot"
            exit 0
          fi
          echo "::error::this PR changes .duvet/snapshot.txt, which changes only at milestones. Restore it with: git checkout origin/$BASE -- .duvet/snapshot.txt. A deliberate milestone snapshot says 'Snapshot: milestone' on its own line in the PR body."
          exit 1
      # Installs the CLI and pulls the engine. The calls below are run steps, so that the PR
      # body reaches dagger through an environment variable and never through
      # the action's own interpolation into its shell.
      - name: install dagger
        uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: duvet report
        run: dagger --progress=plain call duvet-report export --path=.duvet/reports
      - name: upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duvet-report
          path: |
            .duvet/reports/report.html
            .duvet/reports/report.json
            .duvet/reports/models.html
            .duvet/reports/models.json
          if-no-files-found: error
      # The coverage gate over the IDs a PR owns, and the citation ratchet
      # over every requirement (docs/requirements/README.md). A PR ratchets
      # against the merge base of its target branch and its head; a push to
      # main against the commit main was at before it. A tag's commit was
      # ratcheted when it reached main.
      - name: coverage gate and citation ratchet
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          ids=none
          base=""
          if [ "$EVENT" = pull_request ]; then
            ids=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Owns:[[:space:]]*//p' | tr ',' ' ' | xargs || true)
            if [ -z "$ids" ]; then
              echo "::error::PR body has no 'Owns:' line; list the requirement IDs this PR implements (docs/requirements/README.md). A PR that implements no requirement, such as a tooling or docs change, says 'Owns: none'."
              exit 1
            fi
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            # before is all zeros when the push created the branch
            echo "no previous commit of main to ratchet against"
          fi
          echo "gating on: $ids; ratchet base: ${base:-none}"
          if [ "$ids" = none ] && [ -z "$base" ]; then
            exit 0
          fi
          dagger --progress=plain call requirements --owns="$ids" ${base:+--base="$base"}

  # Publishes both images, for linux/amd64 and linux/arm64, once every check
  # has passed on a push to main or of a version tag, and never from a pull
  # request. The Operator's goes to ghcr.io/phoban01/battery-operator, the
  # Exec Agent's to ghcr.io/phoban01/battery-operator/exec-agent. Each is
  # tagged with the commit SHA, and with latest on main or the version on a
  # tag.
  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [lint, test, build, check-generated, requirements]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: install dagger
        uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          tags="$GITHUB_SHA"
          case "$GITHUB_REF" in
            refs/heads/main) tags="$tags,latest" ;;
            refs/tags/v*) tags="$tags,$GITHUB_REF_NAME" ;;
            *) echo "::error::publish runs only for main and version tags, not $GITHUB_REF"; exit 1 ;;
          esac
          echo "publishing at: $tags"
          dagger --progress=plain call publish --tags="$tags" --username="$ACTOR" --password=env://GITHUB_TOKEN
