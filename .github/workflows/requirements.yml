name: requirements

on:
  pull_request:
    # edited: the coverage gate reads the PR body's Owns: line
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DUVET_VERSION: 0.4.3

jobs:
  requirements:
    name: duvet report and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the snapshot guard below diffs against the base branch
          fetch-depth: 0
      # The snapshot records every requirement's status. It changes only at
      # milestones, so that parallel branches do not all conflict on it.
      - name: snapshot changes only at milestones
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- .duvet/snapshot.txt; then
            exit 0
          fi
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -q '^Snapshot: milestone'; then
            echo "snapshot change accepted: the PR body declares a milestone snapshot"
            exit 0
          fi
          echo "::error::this PR changes .duvet/snapshot.txt, which changes only at milestones. Restore it with: git checkout origin/$BASE -- .duvet/snapshot.txt. A deliberate milestone snapshot says 'Snapshot: milestone' on its own line in the PR body."
          exit 1
      # awslabs/duvet ships a composite action that installs the crate at a
      # given version; pinned to a commit on main, version 0.4.3 (crates.io).
      - name: install duvet
        uses: awslabs/duvet@44f43e87683ae6077c64f4aa8fd519910c981fb6 # main, 2026-08-26
        with:
          version: ${{ env.DUVET_VERSION }}
      - name: duvet report
        run: make duvet
      - name: upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duvet-report
          path: |
            .duvet/reports/report.html
            .duvet/reports/report.json
          if-no-files-found: error
      - name: coverage gate over the IDs the PR owns
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ids=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Owns:[[:space:]]*//p' | tr ',' ' ' | xargs || true)
          if [ -z "$ids" ]; then
            echo "::error::PR body has no 'Owns:' line; list the requirement IDs this PR implements (docs/requirements/README.md). A PR that implements no requirement, such as a tooling or docs change, says 'Owns: none'."
            exit 1
          fi
          if [ "$ids" = "none" ]; then
            echo "no requirement IDs claimed; skipping the coverage gate"
            exit 0
          fi
          echo "gating on: $ids"
          # shellcheck disable=SC2086
          SKIP_REPORT=1 hack/duvet-coverage.sh $ids
