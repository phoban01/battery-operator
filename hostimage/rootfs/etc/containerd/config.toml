# containerd for both flintlockd and the kubelet, in containerd v2's
# configuration format (version 3). The devmapper snapshotter is as
# write_containerd_config in flintlock's provision.sh sets it; the CRI
# settings are the ones the kubelet needs.
#
#= docs/requirements/11-host-image.md#image-storage
#/ The Host Image SHALL keep all `flintlockd` and containerd state under
#/ `/var`.
version = 3

root = "/var/lib/containerd"
state = "/run/containerd"

[grpc]
  address = "/run/containerd/containerd.sock"

[metrics]
  address = "127.0.0.1:1338"

[plugins]
  # The thin pool battery-thin-pool.service creates: volume group "flintlock",
  # logical volume "thinpool". flintlockd puts MicroVM volumes on it, in its
  # own containerd namespace, "flintlock" (flintlockd's --containerd-ns
  # default). A namespace needs no configuration here.
  #
  # containerd.service does not start containerd with this file:
  # devmapper-config, its ExecStartPre, copies it to
  # /run/battery/containerd.toml with base_image_size set from the Host
  # configuration's MICROVM_BASE_IMAGE_SIZE. The value here is used only
  # when the Host configuration was not read. Keep base_image_size on a line
  # of its own, once.
  #
  #= docs/requirements/11-host-image.md#image-storage
  #/ If the Host environment file is absent when containerd starts,
  #/ then the Host Image SHALL start containerd with the base image size of the
  #/ image's own containerd configuration.
  [plugins."io.containerd.snapshotter.v1.devmapper"]
    pool_name = "flintlock-thinpool"
    root_path = "/var/lib/containerd/snapshotter/devmapper"
    base_image_size = "10GB"
    discard_blocks = true

  # containerd v2 splits the CRI plugin in three: images, runtime, and the
  # gRPC service (io.containerd.grpc.v1.cri), which keeps only the streaming
  # server and is left at its defaults. The kubelet's pods, in namespace
  # k8s.io, stay on overlayfs.
  [plugins."io.containerd.cri.v1.images"]
    snapshotter = "overlayfs"

    #= docs/requirements/11-host-image.md#image-flintlockd
    #/ The Host Image SHALL configure `flintlockd` and the container
    #/ runtime interface of containerd to read per-registry configuration
    #/ from `/etc/containerd/certs.d`, and SHALL ship no registry
    #/ configuration there.
    # containerd v2 would read /etc/containerd/certs.d:/etc/docker/certs.d by
    # default. One directory, the one flintlockd reads, keeps the kubelet's
    # pulls and flintlockd's alike. The image ships no hosts.toml, so a
    # registry is reached over https with no credential, as before.
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"

  # The pods use the systemd cgroup driver, which is kubeadm's default for
  # the kubelet.
  [plugins."io.containerd.cri.v1.runtime"]
    #= docs/requirements/11-host-image.md#kernel-and-kvm
    #/ The Host Image SHALL configure the container runtime interface
    #/ of containerd to run every unprivileged container of a Kubernetes pod under
    #/ SELinux confinement, in the container domain the base image's policy
    #/ assigns or the one the pod names, rather than unconfined.
    # RuntimeConfig.EnableSelinux of containerd v2's CRI runtime plugin, false
    # by default, when containerd disables go-selinux for the CRI plugin and
    # no pod gets a label. With it the CRI plugin labels each pod from the
    # policy's container contexts (lxc_contexts): container_t with categories
    # of the pod's own, or what the pod's seLinuxOptions ask for. It is
    # the CRI plugin's alone: flintlockd uses containerd for images,
    # snapshots and leases and starts Firecracker and Cloud Hypervisor
    # itself, so the MicroVMs are untouched.
    enable_selinux = true
    [plugins."io.containerd.cri.v1.runtime".containerd]
      default_runtime_name = "runc"
      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
          SystemdCgroup = true
    [plugins."io.containerd.cri.v1.runtime".cni]
      bin_dirs = ["/opt/cni/bin"]
      conf_dir = "/etc/cni/net.d"
