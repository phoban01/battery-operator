# cloud-init on a Host. The Host's bootstrap configuration, for example a
# kubeadm config template, writes /etc/battery/host.conf with write_files
# and joins the cluster with kubeadm; this file only narrows what
# cloud-init does besides that.
#
#= docs/requirements/11-host-image.md#host-configuration
#/ The Host Image SHALL NOT read any secret from the Host
#/ configuration file or from instance user-data.
# No unit or script of the image reads user-data; cloud-init alone does, and
# the image asks nothing secret of it: no passwords are set and password
# logins stay off.
datasource_list: [Ec2, NoCloud, None]
ssh_pwauth: false
disable_root: true
# /etc/battery/host.conf is a plain settings file:
#
#   write_files:
#     - path: /etc/battery/host.conf
#       permissions: "0644"
#       content: |
#         GUEST_SUBNET=10.220.0.0/16
#         PROTECTED_CIDRS=10.0.0.0/16,192.168.0.0/16
#         FLINTLOCKD_CLIENT_CIDRS=192.168.0.0/16
#         HOST_RESERVE_VCPU=2
#         HOST_RESERVE_MEMORY_MB=4096
