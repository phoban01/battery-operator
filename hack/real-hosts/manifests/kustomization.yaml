# The trial's Manifests: config/default and config/exec-agent exactly as
# they ship, with the published images (up.sh sets their tag from
# IMAGE_TAG). Nothing is patched: the Hosts are real, so the Exec Agent's
# Host prerequisites are its defaults, and battery's poolmgrd is the sidecar
# config/manager names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../config/default
- ../../../config/exec-agent
