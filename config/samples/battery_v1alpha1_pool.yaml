apiVersion: battery.liquidmetal-x.dev/v1alpha1
kind: Pool
metadata:
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: pool-sample
spec:
  size: 4
  template:
    vcpu: 2
    memoryInMb: 4096
    # The Guest Images (guestimage/README.md), from v0.3.3, the first
    # release that publishes them. A later release works too.
    kernel:
      image: ghcr.io/phoban01/battery-operator/guest-kernel:v0.3.3
      filename: boot/vmlinux
      cmdline:
        console: ttyS0
        reboot: k
    rootVolume:
      containerSource: ghcr.io/phoban01/battery-operator/guest-rootfs:v0.3.3
    interfaces:
      - deviceId: eth1
        type: Macvtap
  placement:
    nodeSelector:
      kubernetes.io/arch: amd64
  replenishment:
    type: ImmediateOnLease
  hooks:
    create: ["true"]
    failurePolicy: DeleteAndReplace
  lease:
    heartbeatInterval: 10s
    expiryThreshold: 30s
