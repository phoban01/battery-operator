# This rule is not used by the project battery-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over battery.liquidmetal-x.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: microvmclaim-admin-role
rules:
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims
  verbs:
  - '*'
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims/status
  verbs:
  - get
