# The Operator's cluster-wide grants, among them the write access to the
# status of Pools and MicroVMClaims that no other identity the Manifests
# create has (internal/controller/status_rbac.go).
#= docs/requirements/06-deployment.md#access
#/ The Manifests SHALL grant write access to the status
#/ subresources of `Pool` and `MicroVMClaim` to the Operator's identity and
#/ to no other identity they create.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
