# This rule is not used by the project battery-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to battery.liquidmetal-x.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: microvmclaim-viewer-role
rules:
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims/status
  verbs:
  - get
