# This rule is not used by the project battery-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the battery.liquidmetal-x.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: microvmclaim-editor-role
rules:
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - battery.liquidmetal-x.dev
  resources:
  - microvmclaims/status
  verbs:
  - get
