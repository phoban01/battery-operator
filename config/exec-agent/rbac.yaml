# RBAC of the Exec Agent (cmd/exec-agent), which runs on every Host as the
# DaemonSet in daemonset.yaml, as the ServiceAccount
# battery-operator-exec-agent in battery-operator-system.
#
# This file is only what the Exec Agent is allowed to do, and the agent's
# test suite (internal/execagent) runs it as this ServiceAccount with
# exactly these rules, so a call the code makes and this file lacks fails a
# test.
#
# RBAC cannot say "this Host's Node": one DaemonSet shares one
# ServiceAccount. admission-policy.yaml beside this file narrows the Node and
# pod rules to the agent's own Host in the API server (EA-051).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: battery-operator-exec-agent
rules:
  # Every exec request is authenticated with one. A review answers a
  # question and changes nothing.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # The claims every request is authorized against (EA-011 to EA-013) and
  # the drain guard counts (EA-040), read and never written. A request's
  # claim is read with get; the drain guard's cache lists and watches.
  #
  # No permission on Secrets: the uid of a claim's Secret `<claim>-exec`
  # is checked by the API server in the TokenReview (EA-012).
  - apiGroups: ["battery.liquidmetal-x.dev"]
    resources: ["microvmclaims"]
    verbs: ["get", "list", "watch"]
  # The Host's own Node is read, and annotated with the Node report and
  # when a drain started (EA-034, EA-040). The admission policy lets a patch
  # change nothing else. Nodes are never created, deleted or listed, and
  # their status is not written.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  # The Host's certificates (ADR 0003, ADR 0004): the agent requests them
  # and reads each request back until the Operator has signed it. It cannot
  # list, watch, update, delete, approve or sign requests; the API server
  # removes old requests itself.
  #= docs/requirements/05-exec-agent.md#certificates
  #/ The Manifests SHALL grant the Exec Agent's identity permission
  #/ to create and read `CertificateSigningRequest`s, and no other permission
  #/ on them.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["create", "get"]
---
# The drain guard pod and its PodDisruptionBudget (EA-040), in the Exec
# Agent's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battery-operator-exec-agent-guard
  namespace: battery-operator-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: battery-operator-exec-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: battery-operator-exec-agent
subjects:
  - kind: ServiceAccount
    name: battery-operator-exec-agent
    namespace: battery-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battery-operator-exec-agent-guard
  namespace: battery-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battery-operator-exec-agent-guard
subjects:
  - kind: ServiceAccount
    name: battery-operator-exec-agent
    namespace: battery-operator-system
---
# The CA certificates the Operator publishes (CT-005), which the agent
# verifies its flintlockd and its new certificates against and writes the
# client CA bundle for flintlockd from (EA-064, EA-066). Only that one
# ConfigMap, and only get: the agent reads it again every few minutes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battery-operator-exec-agent-ca-bundle
  namespace: battery-operator-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["flintlockd-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battery-operator-exec-agent-ca-bundle
  namespace: battery-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battery-operator-exec-agent-ca-bundle
subjects:
  - kind: ServiceAccount
    name: battery-operator-exec-agent
    namespace: battery-operator-system
