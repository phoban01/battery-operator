# The Exec Agent (cmd/exec-agent) on every Host.
#
# It runs in the Host's network namespace, so that it serves its exec API on
# the Host's internal address (EA-002) and reaches its Host's flintlockd on
# an address of the Host (EA-001).
#
# Which Nodes are Hosts: the DaemonSet runs on Nodes labelled
# battery.liquidmetal-x.dev/host=true, which the cluster's operator sets on
# every Node that meets the Host prerequisites. The Inventory Controller
# then admits a Node only once its Node report says it is ready (IN-001).
#
# Certificates (ADR 0003, ADR 0004): the agent requests its Host's
# certificates itself, through CertificateSigningRequests the Operator
# signs, with keys it generates on the Host. Its own client certificate and
# serving certificate stay in memory. flintlockd's serving certificate, its
# key and the client CA bundle go to /etc/battery/flintlockd on the Host
# (tls.crt, tls.key, client-ca.crt; tls.crt is written last), where the
# Host Image starts flintlockd once they exist and restarts it when they
# change. The Host Image creates that directory, writable by the image's
# user, 65532, and labelled so that the agent may write it and flintlockd
# read it (ADR 0003, consequence 7). --trust-domain has to be the
# Operator's.
#
# Host prerequisites (docs/host-prerequisites.md): the agent checks that the
# Host has a KVM device (EA-031), listed in sysfs at /sys/class/misc/kvm and
# with /dev/kvm a character device, without opening it. It sees the Host's
# /dev read-only at /host/dev, a directory rather than a hostPath of type
# CharDevice, so that a Host without KVM still runs the agent, which reports
# why. It finds containerd's thin pool (EA-032) in sysfs too. Every
# container has the Host's sysfs read-only, so sysfs needs no mount.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: battery-operator-exec-agent
  namespace: battery-operator-system
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/component: exec-agent
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: battery-operator
      app.kubernetes.io/component: exec-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: battery-operator
        app.kubernetes.io/component: exec-agent
    spec:
      serviceAccountName: battery-operator-exec-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      #= docs/requirements/05-exec-agent.md#serving
      #/ The Manifests SHALL run the Exec Agent on every Node labelled
      #/ `battery.liquidmetal-x.dev/host=true`, and on no other Node.
      nodeSelector:
        battery.liquidmetal-x.dev/host: "true"
      tolerations:
        # A Host may be tainted to keep ordinary workloads off it; the agent
        # has to run there regardless.
        - operator: Exists
      containers:
        - name: exec-agent
          image: ghcr.io/phoban01/battery-operator/exec-agent:latest
          command: ["/exec-agent"]
          args:
            - --flintlockd=$(HOST_IP):9090
            - --port=10270
            - --kvm-device=/host/dev/kvm
            # containerd's devmapper pool_name on the Host.
            - --thin-pool=flintlock-thinpool
            # The Operator's trust domain: set it to your own.
            - --trust-domain=cluster.local
            - --flintlockd-cert-dir=/etc/battery/flintlockd
            # The Operator's CA bundle ConfigMap is in the agent's own
            # namespace, $POD_NAMESPACE, under its default name.
          env:
            # The Host's Node, whose Node report the agent keeps (EA-034)
            # and whose name its identity has to carry (EA-050).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The Host's address, where its flintlockd serves.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # The drain guard's namespace (EA-040).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: exec-api
              containerPort: 10270
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # EA-064: flintlockd's certificate, key and client CA bundle.
            - name: flintlockd-certificates
              mountPath: /etc/battery/flintlockd
            # EA-033: the Host Image's units write their not ready reasons
            # here; the agent only reads them.
            - name: not-ready
              mountPath: /run/flr/not-ready.d
              readOnly: true
            # EA-031: the Host's devices, for /dev/kvm.
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
      volumes:
        - name: flintlockd-certificates
          hostPath:
            path: /etc/battery/flintlockd
            type: Directory
        - name: not-ready
          hostPath:
            path: /run/flr/not-ready.d
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
