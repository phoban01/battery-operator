apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
# The Operator's pod: the manager, and battery (poolmgrd) as its sidecar
# (ADR 0001, decision 7; docs/requirements/06-deployment.md#battery-sidecar).
#
# The manager stays the first container: config/default's metrics patch
# adds its argument to containers/0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: battery-operator
  #= docs/requirements/06-deployment.md#battery-sidecar
  #/ The Manifests SHALL run the Operator's pod as a single replica
  #/ that is replaced with the `Recreate` strategy.
  # battery is a single SQLite writer, and a rolling update would start a
  # second one on the same database before the first stops.
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: battery-operator
    spec:
      securityContext:
        # The "restricted" Pod Security Standard. Both images are distroless
        # and run as its nonroot user, 65532; the pod names it so that the
        # two containers are the same user, which lets the Operator signal
        # battery (DP-006), and so that battery's volume is writable by it.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      #= docs/requirements/06-deployment.md#battery-sidecar
      #/ The Operator SHALL restart battery through a single mechanism
      #/ that the Inventory Controller invokes, and SHALL wait until battery answers
      #/ again before any controller calls it.
      # The Operator restarts battery by sending it SIGTERM through the
      # shared process namespace; the kubelet starts it again, with the
      # configuration the Inventory Controller wrote. Why this mechanism:
      # internal/batterysidecar's package documentation.
      shareProcessNamespace: true
      # Only the manager holds the ServiceAccount's token (its
      # kube-api-access volume): battery has no business with the API
      # server, and the Operator's identity may read the CA Secrets.
      automountServiceAccountToken: false
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # The SPIFFE trust domain every Host certificate and battery's
          # client certificate are issued under. It has to be the same here,
          # in config/exec-agent/daemonset.yaml and in
          # config/certificates/battery-client.yaml; change all three
          # together to use your own.
          - --trust-domain=battery.liquidmetal-x.dev
          # The Exec Agent's ServiceAccount, as config/exec-agent names it:
          # only its requests are approved. kustomize's namePrefix does not
          # reach flags, so the name is written out.
          - --exec-agent-service-account=battery-operator-exec-agent
          # battery's gRPC API, on loopback in this pod (DP-001).
          - --battery-address=127.0.0.1:50051
          # battery's ConfigMap, after kustomize's namePrefix, and where this
          # container mounts it: the same volume battery reads.
          - --battery-config-map=battery-operator-battery-config
          - --battery-config-file=/etc/battery/config/config.json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/phoban01/battery-operator:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: battery-config
          mountPath: /etc/battery/config
          readOnly: true
      #= docs/requirements/06-deployment.md#battery-sidecar
      #/ The Manifests SHALL run battery as a container in the
      #/ Operator's pod, listening on a loopback address only.
      # battery's gRPC API listens on 127.0.0.1:50051 and its metrics on
      # 127.0.0.1:9090, as its configuration says (battery-config.yaml), so
      # the container declares no ports and has no probes: nothing outside
      # the pod can reach it, the kubelet's probes included. The Operator's
      # readiness check reports battery instead (DP-012).
      - name: battery
        # The battery version go.mod pins; `make deploy` sets POOLMGRD_IMG here.
        image: ghcr.io/liquidmetal-dev/poolmgrd:0.3.3
        args:
          - -config=/etc/battery/config/config.json
          - -db=/data/poolmgr.db
          - -log-level=info
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: battery-config
          mountPath: /etc/battery/config
          readOnly: true
        - name: battery-tls
          mountPath: /etc/battery/tls
          readOnly: true
        - name: battery-data
          mountPath: /data
        # SQLite's temporary files.
        - name: tmp
          mountPath: /tmp
      volumes:
      # The ServiceAccount token, for the manager alone: what the kubelet
      # would otherwise mount into every container.
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      #= docs/requirements/06-deployment.md#battery-sidecar
      #/ The Manifests SHALL supply battery's configuration, its Hosts
      #/ included, from an object the Operator may write.
      - name: battery-config
        configMap:
          name: battery-config
      #= docs/requirements/06-deployment.md#battery-sidecar
      #/ The Manifests SHALL give battery, from a Secret, a client
      #/ certificate and key for `flintlockd` and the certificate authority that
      #/ verifies the Hosts' `flintlockd` serving certificates.
      # battery's client certificate and key come from the Secret
      # cert-manager issues it into (config/certificates/battery-client.yaml),
      # and the serving CA's certificate, without its key, from the serving
      # CA's Secret. The kubelet mounts them; battery's container holds no
      # credential with which to read the CA Secrets itself.
      - name: battery-tls
        projected:
          sources:
          - secret:
              name: battery-flintlockd-client
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
          - secret:
              name: flintlockd-serving-ca
              items:
              - key: tls.crt
                path: serving-ca.crt
      #= docs/requirements/06-deployment.md#battery-sidecar
      #/ The Manifests SHALL keep battery's database on a persistent
      #/ volume.
      - name: battery-data
        persistentVolumeClaim:
          claimName: battery-data
      - name: tmp
        emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
