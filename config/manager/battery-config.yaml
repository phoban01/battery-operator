# battery's configuration file (poolmgrd's JSON schema), mounted into
# battery's container at /etc/battery/config/config.json.
#
# It names no Hosts: battery v0.5.0 keeps them in its database and refuses
# a file with a "hosts" key, and the Inventory Controller keeps them in
# step through battery's HostAdmin API (ADR 0008). Nothing in the Operator
# reads or writes this ConfigMap, so applying the Manifests again changes
# nothing battery runs with. What ships here is
# internal/batterysidecar.Render's output, which
# internal/batterysidecar's tests check byte for byte.
#
# battery's own API is plaintext on loopback, which only this pod's
# containers can reach.
#= docs/requirements/06-deployment.md#battery-sidecar
#/ The Manifests SHALL supply battery's configuration from a
#/ ConfigMap that names no Hosts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: battery-config
  namespace: system
  labels:
    app.kubernetes.io/name: battery-operator
    app.kubernetes.io/component: battery
    app.kubernetes.io/managed-by: kustomize
data:
  config.json: |
    {
      "api_server": {
        "addr": "127.0.0.1:50051",
        "tls": {
          "insecure": true
        }
      },
      "metrics_addr": "127.0.0.1:9090"
    }
