# The settings of one Host pool. This object is never applied: it is
# local-config, and the host-pool-params Component writes its values into
# the pool's MachineDeployment, KubeadmConfigTemplate, AWSMachineTemplate
# and MachineHealthCheck. config/capi/README.md says how to fill it in and
# how to add a pool.
#
# Replace every value that says REPLACE. This pool cannot be applied as it
# stands.
#
#= docs/requirements/12-host-pool.md#host-pool
#/ The Host Pool Templates SHALL take a Host pool's name, cluster,
#/ size, Kubernetes version, instance type, AMI, subnet, health check
#/ interval, drain timeout and Host configuration file from one settings
#/ object per pool, which is never applied to a cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  # Every pool's settings object needs a name of its own.
  name: host-pool-example
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  # The pool's name, and the name of each of its objects.
  name: battery-hosts-example
  # The Cluster API Cluster of the workload cluster the Hosts join.
  clusterName: REPLACE-workload-cluster
  # The pool size: the number of Hosts.
  replicas: "1"
  # One instance type. A Host needs KVM: a metal instance, or a C8i, M8i or
  # R8i size with nested virtualization (see the options below). It also
  # needs a disk for the thin pool: a metal size with an instance-store
  # disk, or an EBS data volume. Its architecture must be the AMI's, the
  # AMI's battery.liquidmetal-x.dev/architecture tag: x86_64 here. For an
  # arm64 AMI, a Graviton metal size, such as c7gd.metal or c8gd.metal-24xl;
  # Graviton has no nested virtualization.
  instanceType: m6id.metal
  # The AMI published from the Host Image (make host-image-ami), by id, of
  # the instance type's architecture.
  amiID: ami-REPLACE
  # The subnet the Hosts run in, by id.
  subnetID: subnet-REPLACE
  #= docs/requirements/12-host-pool.md#host-pool
  #/ The Host Pool Templates SHALL attach to every Host of a pool the
  #/ additional security groups that the pool's settings list by id.
  # Security groups for the Hosts besides CAPA's own, by id. They have to
  # admit:
  # - TCP 9090, flintlockd's port, from the Operator's pod network: the
  #   ranges of FLINTLOCKD_CLIENT_CIDRS below;
  # - TCP 10270, the Exec Agent's port, from the networks of the Client
  #   Library's consumers: usually the pod network.
  # On a CNI that masquerades pod traffic between Nodes, admit the node
  # range to both. This is a list, not a string: the object is never
  # applied, so kustomize copies the list as it is.
  additionalSecurityGroups:
    - id: sg-REPLACE
  #= docs/requirements/12-host-pool.md#host-pool
  #/ The Host Pool Templates SHALL set the size of every Host's
  #/ root volume, in GiB, from the pool's settings.
  # The size of each Host's root volume, in GiB. It holds the operating
  # system, containerd's images, and the emptyDir volumes of the Host's
  # pods. The thin pool is on the instance-store disk or the data volume,
  # not here.
  rootVolumeGiB: "100"
  #= docs/requirements/12-host-pool.md#host-pool
  #/ The Host Pool Templates SHALL default a Host pool's Kubernetes
  #/ version to the version that the Host Image pins.
  # The Kubernetes version of the Host Image the AMI was made from: its
  # battery.liquidmetal-x.dev/kubernetes-version tag, and KUBERNETES_VERSION
  # in hostimage/versions.env.
  kubernetesVersion: v1.36.3
  # At least the Exec Agent's --drain-timeout, one hour by default (EA-040),
  # with room to spare.
  nodeDrainTimeoutSeconds: "4500"
  # How long a Host's Node may stay not ready before its Machine is
  # replaced.
  unhealthySeconds: "300"
  # Options for a C8i, M8i or R8i pool, which is not metal and has no
  # instance-store disk (config/capi/README.md, "Options"). To use them,
  # uncomment these keys, and add their Components to this pool's
  # kustomization.yaml. A key without its Component does nothing.
  #
  # nestedVirtualization: KVM from nested virtualization. Its Component is
  # host-pool-nested-virtualization.
  # nestedVirtualization: enabled
  #
  # dataVolume*: an EBS volume for the thin pool, attached as /dev/sdb.
  # Nitro shows it as /dev/nvme1n1: set THIN_POOL_DEVICE=/dev/nvme1n1 in
  # host.conf below. gp3 gives 3000 IOPS and 125 MiB/s at any size. Its
  # Component is host-pool-data-volume.
  # dataVolumeGiB: "200"
  # dataVolumeType: gp3
  # dataVolumeEncrypted: "true"
  #= docs/requirements/12-host-pool.md#host-configuration
  #/ The Host Pool Templates SHALL set `FLINTLOCKD_CLIENT_CIDRS` and
  #/ `PROTECTED_CIDRS` in every Host configuration file they write.
  # The Host configuration file, /etc/battery/host.conf (HI-050). Keys and
  # defaults: hostimage/README.md, "Host configuration file", and
  # hostimage/rootfs/usr/share/battery/host.conf.defaults. A key left out
  # takes its default.
  #
  # - FLINTLOCKD_CLIENT_CIDRS: the pod network of the Operator, where
  #   battery runs. It is the only place off the Host that may reach
  #   flintlockd (HI-069). Empty, battery cannot reach the Host.
  # - PROTECTED_CIDRS: the cluster's node, pod and Service ranges, so that
  #   a MicroVM reaches none of them (HI-035, HI-076).
  # - GUEST_SUBNET: the MicroVMs' subnet. Keep it clear of the ranges above.
  host.conf: |
    GUEST_SUBNET=10.220.0.0/16
    PROTECTED_CIDRS=REPLACE-node-cidr,REPLACE-pod-cidr,REPLACE-service-cidr
    FLINTLOCKD_CLIENT_CIDRS=REPLACE-operator-pod-cidr
    HOST_RESERVE_VCPU=2
    HOST_RESERVE_MEMORY_MB=4096
    # Services on the bridge gateway, for a consumer that runs them for its
    # MicroVMs (hostimage/README.md). Left out, guests reach only DHCP and
    # DNS on the gateway.
    # GATEWAY_SERVICE_PORTS=REPLACE-tcp-ports
    # GATEWAY_SERVICE_UIDS=REPLACE-user-ids
    # Addresses in PROTECTED_CIDRS that guests may still reach, such as a
    # VPC interface endpoint in the node range, as /32 entries
    # (hostimage/README.md). Left out, guests reach none of them.
    # GUEST_ALLOWED_CIDRS=REPLACE-endpoint-addresses
