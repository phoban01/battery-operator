# The Host pool `example`: the objects of config/capi/host-pool with the
# settings of host-pool.yaml. Copy this directory to add a pool.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../host-pool
  - host-pool.yaml

components:
  - ../../host-pool-params
  # Options for a C8i, M8i or R8i pool. Each needs its keys in
  # host-pool.yaml (config/capi/README.md, "Options").
  # - ../../host-pool-nested-virtualization
  # - ../../host-pool-data-volume
