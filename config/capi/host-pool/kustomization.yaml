# The objects of one Host pool, with placeholders. Do not build this
# directory on its own: build a pool under config/capi/pools/, which sets
# the placeholders from its host-pool.yaml through the host-pool-params
# Component.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - machinedeployment.yaml
  - kubeadmconfigtemplate.yaml
  - awsmachinetemplate.yaml
  - machinehealthcheck.yaml
