# duvet configuration for the Quint models: see docs/requirements/README.md,
# "Model citations".
#
# A model citation is its own annotation type. duvet 0.4.3 has a fixed set
# of types (citation, test, implication, exception, todo), so this separate
# configuration makes one: it scans only specs/**/*.qnt, for the comment
# prefixes //@= and //@#, and writes its own report. .duvet/config.toml
# never scans the models, and hack/duvet-coverage.sh never reads this
# report, so a model citation cannot count as an implementation or a test.
# hack/duvet-models.sh turns this report into the "modelled" column.
#
# Run it with `make duvet`, which runs both configurations.
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "specs/**/*.qnt"
comment-style = { meta = "//@=", content = "//@#" }

[[specification]]
source = "docs/requirements/01-resources.md"
format = "markdown"

[[specification]]
source = "docs/requirements/02-claims.md"
format = "markdown"

[[specification]]
source = "docs/requirements/03-pools.md"
format = "markdown"

[[specification]]
source = "docs/requirements/04-inventory.md"
format = "markdown"

[[specification]]
source = "docs/requirements/05-exec-agent.md"
format = "markdown"

[[specification]]
source = "docs/requirements/06-deployment.md"
format = "markdown"

[[specification]]
source = "docs/requirements/07-client.md"
format = "markdown"

[[specification]]
source = "docs/requirements/08-test-doubles.md"
format = "markdown"

[[specification]]
source = "docs/requirements/09-certificates.md"
format = "markdown"

[[specification]]
source = "docs/requirements/10-battery.md"
format = "markdown"

[report.html]
enabled = true
path = ".duvet/reports/models.html"
blob-link = "${{ DUVET_BLOB_LINK || 'https://github.com/phoban01/battery-operator/blob/main' }}"
issue-link = "${{ DUVET_ISSUE_LINK || 'https://github.com/phoban01/battery-operator/issues' }}"

[report.json]
enabled = true
path = ".duvet/reports/models.json"

# Modelled requirements are not tracked by the milestone snapshot.
[report.snapshot]
enabled = false
